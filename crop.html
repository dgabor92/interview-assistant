<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 100vw; height: 100vh; overflow: hidden; cursor: crosshair; user-select: none; background: transparent; }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
#overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
#selection { position: absolute; border: 2px solid #818cf8; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); display: none; }
#hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(30,30,30,0.9); color: #e2e8f0; font-family: system-ui; font-size: 13px; padding: 8px 16px; border-radius: 20px; border: 1px solid #4b5563; white-space: nowrap; pointer-events: none; z-index: 10; }
#actions { position: absolute; display: none; gap: 8px; pointer-events: all; z-index: 10; }
#actions button { font-family: system-ui; font-size: 12px; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; }
#btn-confirm { background: #4f46e5; color: white; }
#btn-confirm:hover { background: #4338ca; }
#btn-cancel { background: #374151; color: #e2e8f0; }
#btn-cancel:hover { background: #4b5563; }
</style>
</head>
<body>
<img id="bg" draggable="false">
<div id="overlay"></div>
<div id="hint">Húzd ki a kivágandó területet &middot; Esc = mégse</div>
<div id="selection"></div>
<div id="actions">
  <button id="btn-confirm">&#10003; Küldés AI-nak</button>
  <button id="btn-cancel">&#10005; Mégse</button>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const bg = document.getElementById('bg');
const sel = document.getElementById('selection');
const actions = document.getElementById('actions');
const canvas = document.getElementById('canvas');

let startX = 0, startY = 0, dragging = false, confirmed = false;
let lastX2 = 0, lastY2 = 0;

window.cropAPI.onScreenshot((data) => {
  bg.src = 'data:image/png;base64,' + data;
});

window.cropAPI.ready();

function getBounds(x2, y2) {
  lastX2 = x2; lastY2 = y2;
  return { x: Math.min(startX, x2), y: Math.min(startY, y2), w: Math.abs(x2 - startX), h: Math.abs(y2 - startY) };
}
function getCurrentBounds() { return getBounds(lastX2, lastY2); }
function updateSel(x2, y2) {
  const { x, y, w, h } = getBounds(x2, y2);
  sel.style.left = x + 'px'; sel.style.top = y + 'px';
  sel.style.width = w + 'px'; sel.style.height = h + 'px';
}

document.addEventListener('mousedown', (e) => {
  if (confirmed) { confirmed = false; actions.style.display = 'none'; }
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  sel.style.display = 'block';
  updateSel(e.clientX, e.clientY);
});

document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  updateSel(e.clientX, e.clientY);
});

document.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  dragging = false;
  confirmed = true;
  const { x, y, w, h } = getBounds(e.clientX, e.clientY);
  if (w > 10 && h > 10) {
    actions.style.display = 'flex';
    const actBottom = y + h + 8 + 32;
    actions.style.left = x + 'px';
    actions.style.top = (actBottom > window.innerHeight ? y - 40 : y + h + 8) + 'px';
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.cropAPI.cancel(); });

document.getElementById('btn-cancel').addEventListener('click', () => window.cropAPI.cancel());

document.getElementById('btn-confirm').addEventListener('click', () => {
  const { x, y, w, h } = getCurrentBounds();
  const img = new Image();
  img.onload = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, x * dpr, y * dpr, w * dpr, h * dpr, 0, 0, canvas.width, canvas.height);
    const result = canvas.toDataURL('image/png').split(',')[1];
    window.cropAPI.sendResult(result);
  };
  img.src = bg.src;
});
</script>
</body>
</html>
